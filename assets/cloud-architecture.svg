<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="My AWS practice architecture: user to CloudFront; static site on S3; API on EC2 inside a VPC public subnet with a security group and IAM role; logs and alarms in CloudWatch.">
