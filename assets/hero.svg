<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Prathamesh Khairnar. Aspiring Cloud Engineer: AWS, Linux, Networking and AI products.">
<style>
.drift{animation:dr 40s linear infinite} @keyframes dr{from{transform:translateX(-260px)}to{transform:translateX(1260px)}}
.tw{animation:tw 3.2s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.scan{animation:s 6s linear infinite} @keyframes s{0%{transform:translateX(-240px)}100%{transform:translateX(1200px)}}
.f1{animation:f 1s ease-out both} .f2{animation:f 1s .35s ease-out both} .f3{animation:f 1s .7s ease-out both} .f4{animation:f 1s 1.05s ease-out both}
@keyframes f{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.dash{stroke-dasharray:6 8;animation:da 1.2s linear infinite} @keyframes da{to{stroke-dashoffset:-28}}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-in-out infinite} @keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.cur{animation:c 1s steps(1) infinite} @keyframes c{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.drift,.tw,.scan,.dash,.pulse,.cur{animation:none}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".55" stop-color="#101a33"/><stop offset="1" stop-color="#1b2b55"/></linearGradient>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7aa2f7"/></linearGradient>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/><stop offset=".5" stop-color="#7aa2f7" stop-opacity=".12"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7aa2f7" stroke-opacity=".06"/></pattern>
<clipPath id="c"><rect width="1200" height="320" rx="18"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="1200" height="320" fill="url(#bg)"/><rect width="1200" height="320" fill="url(#grid)"/>
<circle cx="60" cy="120" r="1.4" fill="#fff" class="tw" style="animation-delay:-0.00s"/><circle cx="200" cy="30" r="1.4" fill="#fff" class="tw" style="animation-delay:-0.37s"/><circle cx="330" cy="140" r="1.4" fill="#fff" class="tw" style="animation-delay:-0.74s"/><circle cx="520" cy="20" r="1.4" fill="#fff" class="tw" style="animation-delay:-1.11s"/><circle cx="610" cy="120" r="1.4" fill="#fff" class="tw" style="animation-delay:-1.48s"/><circle cx="880" cy="40" r="1.4" fill="#fff" class="tw" style="animation-delay:-1.85s"/><circle cx="1150" cy="60" r="1.4" fill="#fff" class="tw" style="animation-delay:-2.22s"/><circle cx="1060" cy="20" r="1.4" fill="#fff" class="tw" style="animation-delay:-2.59s"/><circle cx="450" cy="110" r="1.4" fill="#fff" class="tw" style="animation-delay:-2.96s"/><circle cx="150" cy="200" r="1.4" fill="#fff" class="tw" style="animation-delay:-3.33s"/><circle cx="690" cy="260" r="1.4" fill="#fff" class="tw" style="animation-delay:-3.70s"/><circle cx="1180" cy="280" r="1.4" fill="#fff" class="tw" style="animation-delay:-4.07s"/><g class="drift" style="animation-duration:38s;animation-delay:-0s"><path d="M0 22a14 14 0 0 1 14-14 18 18 0 0 1 34-2 13 13 0 0 1 14 16z" transform="translate(80 40) scale(1.3)" fill="#c0caf5" fill-opacity="0.1"/></g><g class="drift" style="animation-duration:46s;animation-delay:-9s"><path d="M0 22a14 14 0 0 1 14-14 18 18 0 0 1 34-2 13 13 0 0 1 14 16z" transform="translate(420 70) scale(0.9)" fill="#c0caf5" fill-opacity="0.08"/></g><g class="drift" style="animation-duration:52s;animation-delay:-18s"><path d="M0 22a14 14 0 0 1 14-14 18 18 0 0 1 34-2 13 13 0 0 1 14 16z" transform="translate(700 30) scale(1.6)" fill="#c0caf5" fill-opacity="0.07"/></g><g class="drift" style="animation-duration:41s;animation-delay:-27s"><path d="M0 22a14 14 0 0 1 14-14 18 18 0 0 1 34-2 13 13 0 0 1 14 16z" transform="translate(980 80) scale(1.0)" fill="#c0caf5" fill-opacity="0.09"/></g>
<rect class="scan" width="240" height="320" fill="url(#beam)"/>
<text class="f1" x="60" y="92" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="16" fill="#FF9900">~/cloud $ whoami<tspan class="cur" fill="#7aa2f7">_</tspan></text>
<text class="f2" x="58" y="152" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#name)">Prathamesh Khairnar</text>
<text class="f3" x="60" y="196" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" fill="#c0caf5">Aspiring Cloud Engineer · AWS · Linux · Networking</text>
<text class="f4" x="60" y="232" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#9aa5ce">I build AI products and ship them to the cloud · Nashik, India</text>
<g class="f4"><path d="M760 200 C820 140 880 140 940 170" fill="none" stroke="#FF9900" stroke-opacity=".35" stroke-width="2" class="dash"/><circle r="4" fill="#FF9900"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M760 200 C820 140 880 140 940 170"/></circle><path d="M940 170 C1000 200 1050 190 1110 150" fill="none" stroke="#7aa2f7" stroke-opacity=".35" stroke-width="2" class="dash"/><circle r="4" fill="#7aa2f7"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M940 170 C1000 200 1050 190 1110 150"/></circle><path d="M760 200 C850 250 950 260 1040 245" fill="none" stroke="#7aa2f7" stroke-opacity=".35" stroke-width="2" class="dash"/><circle r="4" fill="#7aa2f7"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M760 200 C850 250 950 260 1040 245"/></circle><path d="M1040 245 C1080 230 1100 200 1110 150" fill="none" stroke="#FF9900" stroke-opacity=".35" stroke-width="2" class="dash"/><circle r="4" fill="#FF9900"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M1040 245 C1080 230 1100 200 1110 150"/></circle><g class="pulse"><circle cx="760" cy="200" r="16" fill="#FF9900" fill-opacity=".15" stroke="#FF9900" stroke-width="2"/><circle cx="760" cy="200" r="5" fill="#FF9900"/></g><text x="760" y="234" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#9aa5ce">EC2</text><g class="pulse"><circle cx="940" cy="170" r="16" fill="#3fb950" fill-opacity=".15" stroke="#3fb950" stroke-width="2"/><circle cx="940" cy="170" r="5" fill="#3fb950"/></g><text x="940" y="204" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#9aa5ce">S3</text><g class="pulse"><circle cx="1110" cy="150" r="16" fill="#a371f7" fill-opacity=".15" stroke="#a371f7" stroke-width="2"/><circle cx="1110" cy="150" r="5" fill="#a371f7"/></g><text x="1110" y="184" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#9aa5ce">CloudFront</text><g class="pulse"><circle cx="1040" cy="245" r="16" fill="#7aa2f7" fill-opacity=".15" stroke="#7aa2f7" stroke-width="2"/><circle cx="1040" cy="245" r="5" fill="#7aa2f7"/></g><text x="1040" y="279" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#9aa5ce">IAM</text></g>
<rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#7aa2f7" stroke-opacity=".25"/>
</g></svg>